sources:
  rbi_ifsc_razorpay:
    name: "RBI IFSC Master via Razorpay Open-Source IFSC Dataset"
    owner: "Reserve Bank of India (upstream) / Razorpay (MIT-licensed mirror)"
    url: "https://github.com/razorpay/ifsc/releases"
    license: "MIT License (mirror) / Public RBI NEFT/RTGS Directory"
    auth_type: "none (public GitHub release & REST API)"
    refresh_cadence: "monthly / aligned with RBI NEFT-RTGS updates"
    access_date: "2026-11-18"
    robots_verdict: "GitHub API/releases permitted; verified before fetch"
    tos_verdict: "MIT License allows commercial use, redistribution, and aggregation"
    status: "active"
    notes: "Primary bulk source for IFSC codes, MICR, branch address, NEFT/RTGS/IMPS/UPI flags."

  mca_company_master_datagovin:
    name: "MCA Company Master Data (data.gov.in)"
    owner: "Ministry of Corporate Affairs (MCA), Govt. of India"
    url: "https://www.data.gov.in/catalog/company-master-data"
    license: "Government Open Data License - India (GODL)"
    auth_type: "api_key (free data.gov.in registration) / public CSV download"
    refresh_cadence: "monthly / state-wise releases"
    access_date: "2026-11-18"
    robots_verdict: "Verified via robots_checker before fetch"
    tos_verdict: "GODL permits commercial reuse with attribution"
    status: "active"
    notes: "Entity-level corporate registry: CIN, Company Name, Status, Class, Category, RoC, Authorized/Paid-up Capital, Address."

  gst_public_search_and_hsncode:
    name: "GSTIN Public Taxpayer Registry & HSN/SAC Master"
    owner: "Goods and Services Tax Network (GSTN) / CBIC"
    url: "https://services.gst.gov.in/services/searchtp"
    license: "Public statutory lookup (GSTN); captcha-gated on live portal"
    auth_type: "captcha_gated_portal / GSP_licensed_API"
    refresh_cadence: "real-time on portal; monthly aggregate stats on gst.gov.in"
    access_date: "2026-11-18"
    robots_verdict: "Verified via robots_checker"
    tos_verdict: "Captcha on searchtp cannot be bypassed; use public GSTN statistical/HSN downloads + GSP/sandbox schema"
    status: "restricted_live_lookup_public_master_available"
    notes: "Live per-GSTIN lookup requires captcha or GSP access; public CBIC/GSTN HSN & state-wise aggregate data is open."

  gleif_lei_official:
    name: "GLEIF Global Legal Entity Identifier (LEI) - India Entities"
    owner: "Global Legal Entity Identifier Foundation (GLEIF)"
    url: "https://api.gleif.org/api/v1/lei-records?filter[entity.legalAddress.country]=IN"
    license: "CC0 1.0 Universal (Public Domain)"
    auth_type: "none (open REST API)"
    refresh_cadence: "daily (3x daily updates by GLEIF)"
    access_date: "2026-11-18"
    robots_verdict: "https://api.gleif.org/robots.txt returned 200 Disallow: (open)"
    tos_verdict: "CC0 public domain; commercial aggregation & redistribution explicitly permitted"
    status: "active"
    notes: "411,277 Indian corporate entities; surfaces LEI, legal name, status, pincode, and registeredAs (MCA CIN/LLPIN, GSTIN, or Udyam ID)."
