<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="Public Entity Data Warehouse">
  <style>
  text { font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .fg { fill: #E2E8F0; }
  .mut { fill: #94A3B8; }
  .blue { fill: #60A5FA; }
  .green { fill: #34D399; }
  .amber { fill: #FBBF24; }
  .bd { fill: none; stroke: #334155; stroke-width: 1.3; }
  .dot { fill: #34D399; }
  .ring { fill: none; stroke: #34D399; stroke-width: 1.2; }

  .dw-caret { fill: #60A5FA; animation: dw-blink 1.1s step-end infinite; }
  @keyframes dw-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .dw-pulse { transform-origin: 336px 26px; animation: dw-ring 2.4s ease-out infinite; }
  @keyframes dw-ring { 0% { opacity: 0.9; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(2.4); } }

  .dw-tag { opacity: 0; }
  .dw-t1 { animation: dw-cycle 9s ease-in-out infinite 0s; }
  .dw-t2 { animation: dw-cycle 9s ease-in-out infinite 3s; }
  .dw-t3 { animation: dw-cycle 9s ease-in-out infinite 6s; }
  @keyframes dw-cycle {
    0%, 28% { opacity: 1; }
    33%, 95% { opacity: 0; }
    100% { opacity: 1; }
  }

  .dw-p1 { animation: dw-pill-b 8s ease-in-out infinite 0s; }
  .dw-p2 { animation: dw-pill-b 8s ease-in-out infinite 2s; }
  .dw-p3 { animation: dw-pill-b 8s ease-in-out infinite 4s; }
  .dw-p4 { animation: dw-pill-g 8s ease-in-out infinite 6s; }
  @keyframes dw-pill-b {
    0%, 18% { stroke: #60A5FA; stroke-width: 1.7; }
    25%, 100% { stroke: #334155; stroke-width: 1.3; }
  }
  @keyframes dw-pill-g {
    0%, 18% { stroke: #34D399; stroke-width: 1.7; }
    25%, 100% { stroke: #334155; stroke-width: 1.3; }
  }

  .dw-pt1 { animation: dw-ptxt-b 8s ease-in-out infinite 0s; }
  .dw-pt2 { animation: dw-ptxt-b 8s ease-in-out infinite 2s; }
  .dw-pt3 { animation: dw-ptxt-b 8s ease-in-out infinite 4s; }
  .dw-pt4 { animation: dw-ptxt-g 8s ease-in-out infinite 6s; }
  @keyframes dw-ptxt-b {
    0%, 18% { fill: #60A5FA; }
    25%, 100% { fill: #E2E8F0; }
  }
  @keyframes dw-ptxt-g {
    0%, 18% { fill: #34D399; }
    25%, 100% { fill: #E2E8F0; }
  }

  @media (prefers-color-scheme: light) {
    .fg { fill: #0F172A; }
    .mut { fill: #475569; }
    .blue { fill: #1D4ED8; }
    .green { fill: #059669; }
    .amber { fill: #D97706; }
    .bd { stroke: #CBD5E1; }
    .dot { fill: #059669; }
    .ring { stroke: #059669; }
    .dw-caret { fill: #1D4ED8; }
    @keyframes dw-pill-b {
      0%, 18% { stroke: #1D4ED8; stroke-width: 1.7; }
      25%, 100% { stroke: #CBD5E1; stroke-width: 1.3; }
    }
    @keyframes dw-pill-g {
      0%, 18% { stroke: #059669; stroke-width: 1.7; }
      25%, 100% { stroke: #CBD5E1; stroke-width: 1.3; }
    }
    @keyframes dw-ptxt-b {
      0%, 18% { fill: #1D4ED8; }
      25%, 100% { fill: #0F172A; }
    }
    @keyframes dw-ptxt-g {
      0%, 18% { fill: #059669; }
      25%, 100% { fill: #0F172A; }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .dw-caret, .dw-pulse, .dw-t1, .dw-t2, .dw-t3,
    .dw-p1, .dw-p2, .dw-p3, .dw-p4,
    .dw-pt1, .dw-pt2, .dw-pt3, .dw-pt4 { animation: none !important; }
    .dw-t1 { opacity: 1 !important; }
    .dw-t2, .dw-t3 { opacity: 0 !important; }
    .dw-pulse { opacity: 0 !important; }
  }
  </style>

  <circle cx="336" cy="26" r="3.5" class="dot"/>
  <circle cx="336" cy="26" r="3.5" class="ring dw-pulse"/>
  <text x="348" y="30" font-size="12.5" font-weight="600" letter-spacing="1.1" class="mono green">COMPLIANCE-FIRST PIPELINE</text>

  <text x="450" y="74" text-anchor="middle" font-size="38" font-weight="700" letter-spacing="-0.6" class="fg">Public Entity Data Warehouse<tspan class="dw-caret">_</tspan></text>

  <text x="450" y="108" text-anchor="middle" font-size="16" class="mut dw-tag dw-t1">Compliance-first Indian corporate, banking and tax entity pipeline in DuckDB</text>
  <text x="450" y="108" text-anchor="middle" font-size="16" class="mut dw-tag dw-t2">612 vendor APIs audited down to 5 verified public, open-license upstreams</text>
  <text x="450" y="108" text-anchor="middle" font-size="16" class="mut dw-tag dw-t3">Fail-closed robots.txt, SHA-256 provenance, and idempotent SCD Type 2</text>

  <g transform="translate(0, 138)">
    <rect x="115" y="0" width="130" height="30" rx="4" class="bd dw-p1"/>
    <text x="180" y="19" text-anchor="middle" font-size="13" font-weight="600" class="fg dw-pt1">Python 3.11+</text>

    <rect x="265" y="0" width="160" height="30" rx="4" class="bd dw-p2"/>
    <text x="345" y="19" text-anchor="middle" font-size="13" font-weight="500" class="fg dw-pt2">DuckDB SCD Type 2</text>

    <rect x="445" y="0" width="140" height="30" rx="4" class="bd dw-p3"/>
    <text x="515" y="19" text-anchor="middle" font-size="13" font-weight="500" class="fg dw-pt3">Pydantic + httpx</text>

    <rect x="605" y="0" width="180" height="30" rx="4" class="bd dw-p4"/>
    <text x="695" y="19" text-anchor="middle" font-size="13" font-weight="600" class="fg dw-pt4">GODL / CC0 / MIT Only</text>
  </g>
</svg>
