<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 205" width="900" height="205">
  <style>
  text { font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .fg { fill: #E2E8F0; }
  .mut { fill: #94A3B8; }
  .blue { fill: #60A5FA; }
  .green { fill: #34D399; }
  .amber { fill: #FBBF24; }
  .bd { fill: none; stroke: #334155; stroke-width: 1.3; }
  .bd-blue { fill: none; stroke: #60A5FA; stroke-width: 1.3; }
  .bd-green { fill: none; stroke: #34D399; stroke-width: 1.3; }
  .bd-amber { fill: none; stroke: #FBBF24; stroke-width: 1.3; }
  .flow { fill: none; stroke: #60A5FA; stroke-width: 1.5; stroke-dasharray: 5 4; animation: march 1.4s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -18; } }
  @media (prefers-color-scheme: light) {
    .fg { fill: #0F172A; }
    .mut { fill: #475569; }
    .blue { fill: #1D4ED8; }
    .green { fill: #059669; }
    .amber { fill: #D97706; }
    .bd { stroke: #CBD5E1; }
    .bd-blue { stroke: #1D4ED8; }
    .bd-green { stroke: #10B981; }
    .bd-amber { stroke: #F59E0B; }
    .flow { stroke: #1D4ED8; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flow { animation: none; }
  }
</style>
  <text x="450" y="62" text-anchor="middle" font-size="38" font-weight="700" letter-spacing="-0.6" class="fg">Public Entity Data Warehouse</text>
  <text x="450" y="98" text-anchor="middle" font-size="16" class="mut">Compliance-first Indian corporate, banking and tax entity pipeline in DuckDB</text>
  <g transform="translate(0, 128)">
    <rect x="115" y="0" width="130" height="30" rx="4" class="bd-blue"/>
    <text x="180" y="19" text-anchor="middle" font-size="13" font-weight="600" class="blue">Python 3.11+</text>
    <rect x="265" y="0" width="160" height="30" rx="4" class="bd"/>
    <text x="345" y="19" text-anchor="middle" font-size="13" font-weight="500" class="fg">DuckDB SCD Type 2</text>
    <rect x="445" y="0" width="140" height="30" rx="4" class="bd"/>
    <text x="515" y="19" text-anchor="middle" font-size="13" font-weight="500" class="fg">Pydantic + httpx</text>
    <rect x="605" y="0" width="180" height="30" rx="4" class="bd-green"/>
    <text x="695" y="19" text-anchor="middle" font-size="13" font-weight="600" class="green">GODL / CC0 / MIT Only</text>
  </g>
</svg>
