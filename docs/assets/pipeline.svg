<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 185" width="900" height="185" role="img" aria-label="Four-stage data pipeline: Discovery, Compliance, Ingestion, DuckDB Warehouse">
  <style>
  text { font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .fg { fill: #E2E8F0; }
  .mut { fill: #94A3B8; }
  .blue { fill: #60A5FA; }
  .green { fill: #34D399; }
  .amber { fill: #FBBF24; }
  .bd { fill: none; stroke: #334155; stroke-width: 1.3; }
  .flow { fill: none; stroke: #60A5FA; stroke-width: 1.6; stroke-dasharray: 5 4; animation: dw-march 1.2s linear infinite; }
  .sig-dot { fill: #60A5FA; }

  @keyframes dw-march { to { stroke-dashoffset: -18; } }

  /* Synchronized stage pulses over 8s cycle matching signal dot arrival */
  .dw-s1 { animation: dw-box-b 8s ease-in-out infinite 0s; }
  .dw-s2 { animation: dw-box-a 8s ease-in-out infinite 2s; }
  .dw-s3 { animation: dw-box-b 8s ease-in-out infinite 4s; }
  .dw-s4 { animation: dw-box-g 8s ease-in-out infinite 6s; }

  @keyframes dw-box-b {
    0%, 20% { stroke: #60A5FA; stroke-width: 2; }
    26%, 100% { stroke: #334155; stroke-width: 1.3; }
  }
  @keyframes dw-box-a {
    0%, 20% { stroke: #FBBF24; stroke-width: 2; }
    26%, 100% { stroke: #334155; stroke-width: 1.3; }
  }
  @keyframes dw-box-g {
    0%, 20% { stroke: #34D399; stroke-width: 2; }
    26%, 100% { stroke: #334155; stroke-width: 1.3; }
  }

  .dw-l1 { animation: dw-lbl 8s ease-in-out infinite 0s; }
  .dw-l2 { animation: dw-lbl 8s ease-in-out infinite 2s; }
  .dw-l3 { animation: dw-lbl 8s ease-in-out infinite 4s; }
  .dw-l4 { animation: dw-lbl 8s ease-in-out infinite 6s; }
  @keyframes dw-lbl {
    0%, 20% { opacity: 1; }
    26%, 100% { opacity: 0.65; }
  }

  @media (prefers-color-scheme: light) {
    .fg { fill: #0F172A; }
    .mut { fill: #475569; }
    .blue { fill: #1D4ED8; }
    .green { fill: #059669; }
    .amber { fill: #D97706; }
    .bd { stroke: #CBD5E1; }
    .flow { stroke: #1D4ED8; }
    .sig-dot { fill: #1D4ED8; }
    @keyframes dw-box-b {
      0%, 20% { stroke: #1D4ED8; stroke-width: 2; }
      26%, 100% { stroke: #CBD5E1; stroke-width: 1.3; }
    }
    @keyframes dw-box-a {
      0%, 20% { stroke: #D97706; stroke-width: 2; }
      26%, 100% { stroke: #CBD5E1; stroke-width: 1.3; }
    }
    @keyframes dw-box-g {
      0%, 20% { stroke: #059669; stroke-width: 2; }
      26%, 100% { stroke: #CBD5E1; stroke-width: 1.3; }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .flow, .dw-s1, .dw-s2, .dw-s3, .dw-s4, .dw-l1, .dw-l2, .dw-l3, .dw-l4 { animation: none !important; opacity: 1 !important; }
    .sig-dot { display: none; }
  }
  </style>

  <!-- Stage 1 -->
  <rect x="8" y="16" width="196" height="148" rx="4" class="bd dw-s1"/>
  <text x="26" y="42" font-size="12.5" font-weight="700" class="blue dw-l1">01 DISCOVERY</text>
  <text x="26" y="70" font-size="16" font-weight="700" class="fg">Catalog Audit</text>
  <text x="26" y="96" font-size="12.5" class="mut">612 vendor APIs</text>
  <text x="26" y="116" font-size="12.5" class="mut">filtered to 76 entity</text>
  <text x="26" y="136" font-size="12.5" class="mut">public candidates.</text>

  <line x1="204" y1="90" x2="234" y2="90" class="flow"/>

  <!-- Stage 2 -->
  <rect x="234" y="16" width="196" height="148" rx="4" class="bd dw-s2"/>
  <text x="252" y="42" font-size="12.5" font-weight="700" class="amber dw-l2">02 COMPLIANCE</text>
  <text x="252" y="70" font-size="16" font-weight="700" class="fg">Pre-Fetch Gates</text>
  <text x="252" y="96" font-size="12.5" class="mut">Fail-closed robots.txt</text>
  <text x="252" y="116" font-size="12.5" class="mut">DPDP Act 2023 check</text>
  <text x="252" y="136" font-size="12.5" class="mut">SHA-256 + .meta.json</text>

  <line x1="430" y1="90" x2="460" y2="90" class="flow"/>

  <!-- Stage 3 -->
  <rect x="460" y="16" width="196" height="148" rx="4" class="bd dw-s3"/>
  <text x="478" y="42" font-size="12.5" font-weight="700" class="blue dw-l3">03 INGESTION</text>
  <text x="478" y="70" font-size="16" font-weight="700" class="fg">Open Upstreams</text>
  <text x="478" y="96" font-size="12.5" class="mut">RBI IFSC, MCA Master</text>
  <text x="478" y="116" font-size="12.5" class="mut">GLEIF LEI, Pincode</text>
  <text x="478" y="136" font-size="12.5" class="mut">GSTIN Mod-36 check</text>

  <line x1="656" y1="90" x2="686" y2="90" class="flow"/>

  <!-- Stage 4 -->
  <rect x="686" y="16" width="206" height="148" rx="4" class="bd dw-s4"/>
  <text x="704" y="42" font-size="12.5" font-weight="700" class="green dw-l4">04 WAREHOUSE</text>
  <text x="704" y="70" font-size="16" font-weight="700" class="fg">DuckDB Load</text>
  <text x="704" y="96" font-size="12.5" class="mut">Idempotent SCD Type 2</text>
  <text x="704" y="116" font-size="12.5" class="mut">Cross-source joins</text>
  <text x="704" y="136" font-size="12.5" class="mut">CIN, LEI, IFSC, Pincode</text>

  <!-- Travelling signal dot across all 4 stages -->
  <circle r="4" class="sig-dot">
    <animateMotion dur="8s" repeatCount="indefinite" path="M 106 90 L 332 90 L 558 90 L 789 90"/>
  </circle>
</svg>
