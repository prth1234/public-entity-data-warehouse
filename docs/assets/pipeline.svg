<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 185" width="900" height="185">
  <style>
  text { font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .fg { fill: #E2E8F0; }
  .mut { fill: #94A3B8; }
  .blue { fill: #60A5FA; }
  .green { fill: #34D399; }
  .amber { fill: #FBBF24; }
  .bd { fill: none; stroke: #334155; stroke-width: 1.3; }
  .bd-blue { fill: none; stroke: #60A5FA; stroke-width: 1.3; }
  .bd-green { fill: none; stroke: #34D399; stroke-width: 1.3; }
  .bd-amber { fill: none; stroke: #FBBF24; stroke-width: 1.3; }
  .flow { fill: none; stroke: #60A5FA; stroke-width: 1.5; stroke-dasharray: 5 4; animation: march 1.4s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -18; } }
  @media (prefers-color-scheme: light) {
    .fg { fill: #0F172A; }
    .mut { fill: #475569; }
    .blue { fill: #1D4ED8; }
    .green { fill: #059669; }
    .amber { fill: #D97706; }
    .bd { stroke: #CBD5E1; }
    .bd-blue { stroke: #1D4ED8; }
    .bd-green { stroke: #10B981; }
    .bd-amber { stroke: #F59E0B; }
    .flow { stroke: #1D4ED8; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flow { animation: none; }
  }
</style>
  <!-- Stage 1 -->
  <rect x="8" y="16" width="196" height="148" rx="4" class="bd"/>
  <text x="26" y="42" font-size="12.5" font-weight="700" class="blue">01 DISCOVERY</text>
  <text x="26" y="70" font-size="16" font-weight="700" class="fg">Catalog Audit</text>
  <text x="26" y="96" font-size="12.5" class="mut">612 vendor APIs</text>
  <text x="26" y="116" font-size="12.5" class="mut">filtered to 76 entity</text>
  <text x="26" y="136" font-size="12.5" class="mut">public candidates.</text>

  <line x1="204" y1="90" x2="234" y2="90" class="flow"/>

  <!-- Stage 2 -->
  <rect x="234" y="16" width="196" height="148" rx="4" class="bd-amber"/>
  <text x="252" y="42" font-size="12.5" font-weight="700" class="amber">02 COMPLIANCE</text>
  <text x="252" y="70" font-size="16" font-weight="700" class="fg">Pre-Fetch Gates</text>
  <text x="252" y="96" font-size="12.5" class="mut">Fail-closed robots.txt</text>
  <text x="252" y="116" font-size="12.5" class="mut">DPDP Act 2023 check</text>
  <text x="252" y="136" font-size="12.5" class="mut">SHA-256 + .meta.json</text>

  <line x1="430" y1="90" x2="460" y2="90" class="flow"/>

  <!-- Stage 3 -->
  <rect x="460" y="16" width="196" height="148" rx="4" class="bd"/>
  <text x="478" y="42" font-size="12.5" font-weight="700" class="blue">03 INGESTION</text>
  <text x="478" y="70" font-size="16" font-weight="700" class="fg">Open Upstreams</text>
  <text x="478" y="96" font-size="12.5" class="mut">RBI IFSC, MCA Master</text>
  <text x="478" y="116" font-size="12.5" class="mut">GLEIF LEI, Pincode</text>
  <text x="478" y="136" font-size="12.5" class="mut">GSTIN Mod-36 check</text>

  <line x1="656" y1="90" x2="686" y2="90" class="flow"/>

  <!-- Stage 4 -->
  <rect x="686" y="16" width="206" height="148" rx="4" class="bd-green"/>
  <text x="704" y="42" font-size="12.5" font-weight="700" class="green">04 WAREHOUSE</text>
  <text x="704" y="70" font-size="16" font-weight="700" class="fg">DuckDB Load</text>
  <text x="704" y="96" font-size="12.5" class="mut">Idempotent SCD Type 2</text>
  <text x="704" y="116" font-size="12.5" class="mut">Cross-source joins</text>
  <text x="704" y="136" font-size="12.5" class="mut">CIN, LEI, IFSC, Pincode</text>
</svg>
