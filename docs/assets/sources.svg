<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <style>
  text { font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .fg { fill: #E2E8F0; }
  .mut { fill: #94A3B8; }
  .blue { fill: #60A5FA; }
  .green { fill: #34D399; }
  .amber { fill: #FBBF24; }
  .bd { fill: none; stroke: #334155; stroke-width: 1.3; }
  .bd-blue { fill: none; stroke: #60A5FA; stroke-width: 1.3; }
  .bd-green { fill: none; stroke: #34D399; stroke-width: 1.3; }
  .bd-amber { fill: none; stroke: #FBBF24; stroke-width: 1.3; }
  .flow { fill: none; stroke: #60A5FA; stroke-width: 1.5; stroke-dasharray: 5 4; animation: march 1.4s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -18; } }
  @media (prefers-color-scheme: light) {
    .fg { fill: #0F172A; }
    .mut { fill: #475569; }
    .blue { fill: #1D4ED8; }
    .green { fill: #059669; }
    .amber { fill: #D97706; }
    .bd { stroke: #CBD5E1; }
    .bd-blue { stroke: #1D4ED8; }
    .bd-green { stroke: #10B981; }
    .bd-amber { stroke: #F59E0B; }
    .flow { stroke: #1D4ED8; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flow { animation: none; }
  }
</style>
  <!-- Row 1: 3 cards -->
  <rect x="10" y="10" width="280" height="92" rx="4" class="bd"/>
  <text x="28" y="38" font-size="19" font-weight="700" class="mono green">183,214</text>
  <text x="28" y="62" font-size="15" font-weight="600" class="fg">RBI Bank Branches</text>
  <text x="28" y="84" font-size="12.5" class="mut">razorpay/ifsc v2.0.62 (MIT)</text>

  <rect x="310" y="10" width="280" height="92" rx="4" class="bd"/>
  <text x="328" y="38" font-size="19" font-weight="700" class="mono blue">8,408</text>
  <text x="328" y="62" font-size="15" font-weight="600" class="fg">MCA Company CINs</text>
  <text x="328" y="84" font-size="12.5" class="mut">api.data.gov.in (GODL)</text>

  <rect x="610" y="10" width="280" height="92" rx="4" class="bd"/>
  <text x="628" y="38" font-size="19" font-weight="700" class="mono blue">10,000</text>
  <text x="628" y="62" font-size="15" font-weight="600" class="fg">Indian GLEIF LEIs</text>
  <text x="628" y="84" font-size="12.5" class="mut">api.gleif.org (CC0, 10K cap)</text>

  <!-- Row 2: 2 cards -->
  <rect x="10" y="118" width="430" height="90" rx="4" class="bd"/>
  <text x="28" y="146" font-size="19" font-weight="700" class="mono green">19,300</text>
  <text x="28" y="170" font-size="15" font-weight="600" class="fg">India Post Pincodes (dim_pincode)</text>
  <text x="28" y="192" font-size="12.5" class="mut">MIT mirror + district inference fallback</text>

  <rect x="460" y="118" width="430" height="90" rx="4" class="bd-amber"/>
  <text x="478" y="146" font-size="19" font-weight="700" class="mono amber">649 + Mod-36</text>
  <text x="478" y="170" font-size="15" font-weight="600" class="fg">CBIC HSN/SAC &amp; GSTIN Validator</text>
  <text x="478" y="192" font-size="12.5" class="mut">Captcha/GSP-gated registry isolated; offline checksum</text>
</svg>
